# docker-compose.yml for Linkwarden
#
# Usage:
#   1. Copy .env.example to .env and set LW_SESSION_SECRET
#   2. docker compose up -d

version: "3.8"

services:
  linkwarden:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      LW_LISTEN: "0.0.0.0:3000"
      LW_DATA_DIR: "/data"
      LW_SESSION_SECRET: "${LW_SESSION_SECRET}"
      LW_COOKIE_SECURE: "${LW_COOKIE_SECURE:-true}"
      LW_LOG_FORMAT: "${LW_LOG_FORMAT:-json}"
      RUST_LOG: "${RUST_LOG:-info,linkwarden=debug}"
    volumes:
      - linkwarden-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Caddy reverse proxy for automatic HTTPS
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - linkwarden
    restart: unless-stopped
    profiles: ["with-proxy"]

volumes:
  linkwarden-data:
  caddy-data:
  caddy-config:

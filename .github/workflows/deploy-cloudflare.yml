name: Deploy Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkdock-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/cloudflare'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      WRANGLER_SEND_METRICS: 'false'
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: cloudflare
      - name: Validate production configuration
        run: npm run preflight -- --production
        working-directory: cloudflare
      - run: npm run typecheck
        working-directory: cloudflare
      - run: npm run test:scripts
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - run: npm run build
        working-directory: web
      - name: Migrate, publish and verify existing resources
        run: node scripts/deploy.mjs
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

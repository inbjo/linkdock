[package]
name = "linkdock"
version = "0.1.0"
edition = "2021"
description = "A self-hosted, Floccus-compatible bookmark service"
license = "AGPL-3.0"

[features]
test-support = ["dep:reqwest", "dep:tempfile"]

[lib]
name = "linkdock"
path = "src/lib.rs"

[[bin]]
name = "linkdock"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time", "uuid"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
time = { version = "0.3", features = ["serde", "serde-human-readable", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
cookie = "0.18"
hex = "0.4"
subtle = "2"
mime_guess = "2"
futures = "0.3"
csv = "1"
url = "2"
webauthn-rs = "0.5"
reqwest = { version = "0.12", features = ["json", "cookies"], optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dev-dependencies.linkdock]
path = "."
features = ["test-support"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

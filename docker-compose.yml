# =============================================================================
# docker-compose.yml for Linkwarden
# =============================================================================
#
# Quick start:
#   1. cp .env.example .env
#   2. Edit .env: set LW_SESSION_SECRET (run: openssl rand -hex 32)
#   3. docker compose up -d
#   4. curl http://localhost:3000/health/live
#
# With Caddy reverse proxy (automatic HTTPS):
#   docker compose --profile with-proxy up -d
# =============================================================================

services:
  linkwarden:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkwarden:latest
    container_name: linkwarden
    ports:
      - "${LW_PORT:-3000}:3000"
    environment:
      LW_LISTEN: "0.0.0.0:3000"
      LW_DATA_DIR: "/data"
      LW_SESSION_SECRET: "${LW_SESSION_SECRET:?Set LW_SESSION_SECRET in .env}"
      LW_COOKIE_SECURE: "${LW_COOKIE_SECURE:-true}"
      LW_CORS_ORIGINS: "${LW_CORS_ORIGINS:-}"
      LW_LOG_FORMAT: "${LW_LOG_FORMAT:-json}"
      RUST_LOG: "${RUST_LOG:-info,linkwarden=debug}"
    volumes:
      - linkwarden-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Caddy reverse proxy for automatic HTTPS
  caddy:
    image: caddy:2
    container_name: linkwarden-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${LW_DOMAIN:-bookmarks.example.com}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      linkwarden:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["with-proxy"]

volumes:
  linkwarden-data:
  caddy-data:
  caddy-config:

name: Cloudflare CI

on:
  push:
    branches: [cloudflare]
  pull_request:
    branches: [cloudflare]

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            cloudflare/package-lock.json
            web/package-lock.json
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Install Worker
        working-directory: cloudflare
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Typecheck
        working-directory: cloudflare
        run: npm run typecheck
      - name: Deployment preflight and script tests
        working-directory: cloudflare
        run: |
          npm run preflight
          npm run test:scripts
      - name: Integration tests
        working-directory: cloudflare
        run: npm test
      - name: Bundle Worker (no deployment)
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run

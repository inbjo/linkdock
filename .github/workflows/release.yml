name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Linkdock ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  build-binary:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static Linux binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/verify-static.sh target/${{ matrix.target }}/release/linkdock

      - name: Package
        id: package
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TARGET="${{ matrix.target }}"
          PKG_NAME="linkdock_${VERSION#v}_${TARGET}"
          mkdir -p "$PKG_NAME"
          cp target/$TARGET/release/linkdock "$PKG_NAME/" 2>/dev/null || \
            cp target/$TARGET/release/linkdock.exe "$PKG_NAME/" 2>/dev/null || true
          cp -r deploy "$PKG_NAME/"
          cp .env.example "$PKG_NAME/"
          cp README.md "$PKG_NAME/"
          cp LICENSE "$PKG_NAME/" 2>/dev/null || true

          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${PKG_NAME}.zip" "$PKG_NAME"
            echo "asset=${PKG_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
            echo "asset=${PKG_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

          sha256sum "${PKG_NAME}.tar.gz" "${PKG_NAME}.zip" 2>/dev/null > checksums.txt || \
            sha256sum "${PKG_NAME}.tar.gz" > checksums.txt || \
            sha256sum "${PKG_NAME}.zip" > checksums.txt
          echo "checksum=checksums.txt" >> $GITHUB_OUTPUT

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.checksum }}

  build-docker:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
